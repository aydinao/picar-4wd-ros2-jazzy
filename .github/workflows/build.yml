name: build

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  build:
    name: compile (x86_64, Ubuntu 24.04)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      # libgpiod 1.6.3 on noble — the same v1 API the Pi target uses.
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake build-essential pkg-config libgpiod-dev

      - name: Configure
        run: cmake -B build

      - name: Build
        run: cmake --build build -j"$(nproc)"
