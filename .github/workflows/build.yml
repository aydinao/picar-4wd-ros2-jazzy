name: build

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  build:
    name: colcon build (RoboStack Jazzy, x86_64)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      # Same environment as local dev: RoboStack via pixi, no sudo, no apt.
      - uses: prefix-dev/setup-pixi@v0.8.1
        with:
          cache: true

      - name: Build
        run: pixi run build
