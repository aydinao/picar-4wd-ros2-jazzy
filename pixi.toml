# RoboStack/pixi environment. Gives ROS 2 Jazzy with no sudo and no apt, on
# both the x86_64 laptop and the aarch64 Pi, from the same manifest.
#
#   pixi install          resolve + fetch
#   pixi shell            enter the environment
#   pixi run build        colcon build
#
[workspace]
name = "picar-4wd-ros2-jazzy"
version = "0.1.0"
description = "ros2_control hardware interface for the SunFounder PiCar-4WD HAT"
channels = ["https://prefix.dev/conda-forge", "https://prefix.dev/robostack-jazzy"]
platforms = ["linux-64", "linux-aarch64"]

[dependencies]
# --- ROS 2 ---
ros-jazzy-ros2-control = "*"       # hardware_interface, controller_manager
ros-jazzy-ros2-controllers = "*"   # diff_drive_controller, joint_state_broadcaster
ros-jazzy-robot-state-publisher = "*"
ros-jazzy-xacro = "*"

# ros2 CLI verbs. The base ros2cli ships only a few; `launch` and `run` are
# needed to bring anything up, including picar_ros itself.
ros-jazzy-ros2launch = "*"
ros-jazzy-ros2run = "*"
ros-jazzy-ros2pkg = "*"
ros-jazzy-ament-cmake = "*"
# Not used by picar itself. Needed only to build the ros2_control_demos
# reference clone in the same environment; safe to drop if you stop using it.
ros-jazzy-ros2-control-cmake = "*"

# --- build tooling ---
colcon-common-extensions = "*"
cmake = "*"
ninja = "*"
pkg-config = "*"
compilers = "*"

# --- hardware ---
# The driver targets the libgpiod *v2* API (gpiod_chip_open, line settings +
# line config + request config, gpiod_line_request_*). Ubuntu 24.04's system
# package is 1.6.3, where those symbols do not exist, so build inside pixi on
# both machines. To check what resolved:
#   pixi run -- pkg-config --modversion libgpiod
libgpiod = ">=2"

[tasks]
build = "colcon build --symlink-install --event-handlers console_direct+"
test = { cmd = "colcon test --event-handlers console_direct+ --return-code-on-test-failure", depends-on = ["build"] }
clean = "rm -rf build install log"
# Build from a fresh clone of HEAD in a temp dir: only tracked files, exactly
# what CI sees. Catches "works on my machine" bugs like referencing an
# untracked directory. Run this before pushing.
ci-local = """
rm -rf /tmp/picar-cicheck &&
git clone --quiet --recurse-submodules . /tmp/picar-cicheck &&
cd /tmp/picar-cicheck &&
pixi run build &&
echo 'CLEAN-CLONE BUILD OK'
"""
